name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Merge locale messages
        run: npm run messages:merge

      # Os JSON gerados são versionados: falha se messages/parts|partials divergirem deles.
      - name: Check locale messages are in sync
        run: git diff --exit-code -- messages/

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
